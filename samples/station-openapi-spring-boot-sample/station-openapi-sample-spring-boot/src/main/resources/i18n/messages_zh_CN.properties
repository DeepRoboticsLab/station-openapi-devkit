REMOTE_API_DOG_PROP_DOG_CODE_REQUIRED=查询四足狗状态时 dogCode 不能为空
REMOTE_API_ROAD_MAP_DOG_CODE_REQUIRED=查询路网边时四足狗编码 dogCode 不能为空
