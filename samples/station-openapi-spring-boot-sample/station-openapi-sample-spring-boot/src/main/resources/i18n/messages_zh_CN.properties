REMOTE_API_CAMERA_CTRL_TYPE_MIN=控制类型 ctrlType 不能小于 1
REMOTE_API_CAMERA_COMMAND_REQUIRED=控制指令 command 不能为空，请按 ctrlType 传入对应指令
